spring:
  datasource:
    url: jdbc:mysql://localhost:3306/helper?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: helper-prod-secret-key-change-this-in-real-production
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

server:
  port: 8080

ai:
  api:
    url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini